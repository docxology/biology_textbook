# Biology Textbook Project Configuration
# Inherits workspace settings from root pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biology_textbook"
version = "1.0.0"
description = "Comprehensive introductory biology textbook with tested computational modules and Mermaid diagram generation"
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
diagrams = [
    # mmdc (Mermaid CLI) is installed separately: npm install -g @mermaid-js/mermaid-cli
    # pillow is already in core deps for PNG handling
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
    "**/biology/enrichment/catalog.py",
    # Maintenance engines migrated from scripts/ — covered by integration smoke tests, not unit floor.
    "**/biology/enrichment/engine.py",
    "**/biology/answer_refinement/engine.py",
    "**/biology/curriculum_sync/engine.py",
    "**/biology/quality/engine.py",
    # Legacy paths when --cov=src is run from the project directory.
    "src/biology/enrichment/catalog.py",
    "src/biology/enrichment/engine.py",
    "src/biology/answer_refinement/engine.py",
    "src/biology/curriculum_sync/engine.py",
    "src/biology/quality/engine.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
mypy_path = ["src", "typings", "../.."]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "infrastructure.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mermaid"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "tests.test_mermaid_and_visualization"
disable_error_code = ["attr-defined"]

[tool.uv]
# Inherits workspace settings from root pyproject.toml
