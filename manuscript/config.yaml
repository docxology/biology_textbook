# Biology Textbook Manuscript Configuration
# Controls chapter auto-numbering, ordering, rendering metadata, page layout,
# and typography. All chapter file references are by descriptive name —
# numbers are assigned automatically at render time.
#
# CONFIGURATION SECTIONS:
#   book:        Bibliographic metadata (author, ORCID, edition, license)
#   authors:     Full author list with affiliations
#   publication: DOI, repository_url, repository_label, keywords
#   layout:      Page margins, page size (all configurable here)
#   typography:  Fonts, link color, code style
#   front_matter: Front matter file list and ordering
#   rendering:   Chapter/figure/equation auto-numbering options
#   units:       Chapter order and enabling/disabling individual chapters
#   llm:         Optional LLM review and translation stages

book:
  title: "Introduction to Biology"
  subtitle: "A Generative Approach"
  author: "Daniel Ari Friedman"
  orcid: "0000-0001-6232-9096" # Author ORCID identifier
  edition: "1.0"
  year: 2026
  language: "en"
  license: "CC BY 4.0"
  code_license: "Apache-2.0"
  cover:
    image: "assets/cover/biology_textbook_cover.png"
    alt: "Integrated biology montage spanning molecules, cells, organisms, networks, and ecosystems."

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  doi: "10.5281/zenodo.20286478"
  repository_url: "https://github.com/docxology/biology_textbook"
  repository_label: "Source repository"
  keywords:
    - "introductory biology"
    - "computational biology"
    - "mathematical modeling"
    - "open textbook"
    - "Python"

# ---------------------------------------------------------------------------
# ANALYSIS ORCHESTRATION
# ---------------------------------------------------------------------------
# Stage 02 runs only these build-producing scripts, in this order. Maintenance
# scripts remain callable by hand but are intentionally excluded from the
# automated pipeline so rendering is reproducible and non-mutating.
analysis:
  scripts:
    - generate_figures.py
    - generate_diagrams.py
    - biology_analysis.py

# ---------------------------------------------------------------------------
# PAGE LAYOUT  (all values in mm unless noted; adjust here only)
# ---------------------------------------------------------------------------
layout:
  page_size: "letter" # letter | a4 | a5
  # Margins — compact for maximum text density (applied via manuscript/preamble.md).
  # To change margins: update BOTH config.yaml AND preamble.md geometry block.
  margin_top_mm: 2
  margin_bottom_mm: 2
  margin_left_mm: 2
  margin_right_mm: 2
  # Binding (inner) margin added when two-sided printing is desired.
  margin_inner_extra_mm: 0 # set to 6–10 for printed binding
  line_height: 1.28 # paragraph line spacing multiplier; must match \setstretch in preamble.md
  text_width_fraction: 0.99 # near-full page width

# ---------------------------------------------------------------------------
# TYPOGRAPHY
# ---------------------------------------------------------------------------
typography:
  body_font: "Linux Libertine O" # Pandoc/LaTeX body font; change to any installed font
  heading_font: "Linux Biolinum O" # Heading font (sans-serif companion)
  mono_font: "DejaVu Sans Mono" # Code / monospace font
  base_font_size_pt: 9 # Base body size in points (enforced in preamble.md via \normalsize)
  # Hyperlink color — RED for all link types
  link_color: "#CC0000" # Red links (internal + external)
  link_color_internal: "#CC0000" # Cross-reference links (same document)
  link_color_external: "#CC0000" # External URL links
  link_underline: true # Underline links in PDF

# ---------------------------------------------------------------------------
# FRONT MATTER
# ---------------------------------------------------------------------------
front_matter:
  # Source files rendered after the generated cover, publishing page, and ToC.
  files:
    - file: front_matter.md # Dedication, acknowledgements, navigation, about
      title: "Front Matter"
    - file: preface.md # Preface
      title: "Preface"
  # Optional blocks rendered directly on page 2, the generated publishing page.
  page_two_quote:
    text: "“The tree which moves some to tears of joy is in the eyes of others only a green thing that stands in the way. Some see nature all ridicule and deformity... and some scarce see nature at all. But to the eyes of the man of imagination, nature is imagination itself.”"
    attribution: "William Blake"
  page_two_acknowledgements:
    title: "Acknowledgements"
    text: "This open textbook is built from a living chain of public scholarship, open-source tools, tested computational models, and classroom-facing biological explanation. The author thanks the students, educators, research communities, open-science maintainers, and standards bodies whose work makes a reproducible, adaptable biology text possible."
  # Set to false to skip a file without deleting it.
  include_front_matter: true
  include_preface: true

# ---------------------------------------------------------------------------
# UNITS — Chapter order and content
# ---------------------------------------------------------------------------
# Each chapter within a unit is numbered sequentially, continuing from the
# previous unit. To reorder chapters: change the order of items under
# 'chapters:'. To skip a chapter: add 'enabled: false'.

units:
  - id: unit_0
    title: "Systems Science and the Biology of Complexity"
    label: "0"
    directory: unit_0
    chapters:
      - file: systems_science.md
        title: "Systems Science and the Logic of Emergence"
      - file: complex_adaptive_systems.md
        title: "Complex Adaptive Systems"
      - file: active_inference.md
        title: "Active Inference and the Free Energy Principle"
      - file: history_philosophy_biology.md
        title: "History and Philosophy of Biology"

  - id: unit_I
    title: "Chemistry of Life"
    label: "I"
    directory: unit_I
    chapters:
      - file: atoms_molecules.md
        title: "Atoms, Molecules, and Chemical Bonds"
      - file: water_and_life.md
        title: "Water — The Molecule of Life"
      - file: macromolecules.md
        title: "Biological Macromolecules"
      - file: enzymes_and_kinetics.md
        title: "Enzymes and the Kinetics of Catalysis"

  - id: unit_II
    title: "The Cell"
    label: "II"
    directory: unit_II
    chapters:
      - file: cell_theory.md
        title: "Cell Theory and Cell Types"
      - file: cell_structure.md
        title: "Cell Structure and Organelles"
      - file: membrane_transport.md
        title: "Membrane Structure and Transport"
      - file: cell_signaling.md
        title: "Cell Signaling and Communication"

  - id: unit_III
    title: "Energy and Metabolism"
    label: "III"
    directory: unit_III
    chapters:
      - file: bioenergetics_and_respiration.md
        title: "Bioenergetics and Cellular Respiration"
      - file: photosynthesis.md
        title: "Photosynthesis"
      - file: metabolic_integration.md
        title: "Metabolic Integration and Regulation"

  - id: unit_IV
    title: "Molecular Genetics"
    label: "IV"
    directory: unit_IV
    chapters:
      - file: dna_replication_and_cell_cycle.md
        title: "DNA Replication and the Cell Cycle"
      - file: gene_expression.md
        title: "Gene Expression — Transcription and Translation"
      - file: mutations_and_genomics.md
        title: "Mutations, CRISPR, and Genomics"
      - file: chromatin_and_epigenetic_mechanisms.md
        title: "Chromatin and Epigenetic Mechanisms"
      - file: epigenetic_inheritance_and_disease.md
        title: "Epigenetic Inheritance and Disease"


  - id: unit_V
    title: "Classical Genetics and Heredity"
    label: "V"
    directory: unit_V
    chapters:
      - file: mendelian_principles.md
        title: "Mendelian Principles and Probability"
      - file: mendelian_extensions_and_human_genetics.md
        title: "Mendelian Extensions and Human Genetics"
      - file: chromosomal_inheritance.md
        title: "Chromosomal Inheritance and Linkage"
      - file: population_genetics.md
        title: "Population Genetics and Hardy-Weinberg Equilibrium"

  - id: unit_VI
    title: "Evolution"
    label: "VI"
    directory: unit_VI
    chapters:
      - file: evolution_and_selection.md
        title: "Evolution — Theory, Natural Selection, and Adaptation"
      - file: genetic_drift_and_speciation.md
        title: "Genetic Drift, Gene Flow, and Speciation"
      - file: phylogenetics.md
        title: "Phylogenetics and the Tree of Life"

  - id: unit_VII
    title: "Microbiology"
    label: "VII"
    directory: unit_VII
    chapters:
      - file: bacteria_archaea_viruses.md
        title: "Bacteria, Archaea, and Viruses"
      - file: microbial_ecology.md
        title: "Microbial Ecology and the Microbiome"
      - file: host_immunity_and_vaccines.md
        title: "Host Immunity and Vaccines"
      - file: antimicrobial_resistance_and_epidemiology.md
        title: "Antimicrobial Resistance and Epidemiology"

  - id: unit_VIII
    title: "Botany — Plant Biology"
    label: "VIII"
    directory: unit_VIII
    chapters:
      - file: plant_structure_and_water.md
        title: "Plant Structure, Water Relations, and Transport"
      - file: plant_reproduction.md
        title: "Plant Reproduction and Development"
      - file: plant_responses.md
        title: "Plant Responses to the Environment"

  - id: unit_IX
    title: "Zoology and Systems Physiology"
    label: "IX"
    directory: unit_IX
    chapters:
      - file: circulation_respiration_homeostasis.md
        title: "Circulation, Respiration, and Homeostasis"
      - file: nervous_system.md
        title: "Nervous System and Neural Signaling"
      - file: action_potential_synapses.md
        title: "Action Potentials and Synaptic Transmission"
      - file: endocrine_signaling.md
        title: "Endocrine Signaling and Homeostasis"
      - file: immune_system_defense.md
        title: "Immune System Architecture and Defense"

  - id: unit_X
    title: "Ecology"
    label: "X"
    directory: unit_X
    chapters:
      - file: population_ecology.md
        title: "Population Ecology and Growth Models"
      - file: community_interactions.md
        title: "Community Interactions and Succession"
      - file: biodiversity_and_food_webs.md
        title: "Biodiversity, Food Webs, and Biogeography"
      - file: ecosystem_ecology.md
        title: "Ecosystem Ecology and Biogeochemical Cycles"
      - file: biomes_and_conservation.md
        title: "Biomes and Conservation Biology"

