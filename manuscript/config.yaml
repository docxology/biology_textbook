# synthesis. Lab and question-bank display titles are derived by
# src/biology/toc.py from the parent chapter title; keep only file names here.
# Set both to false to render ONLY the core textbook chapters.

appendices:
  include_labs: true          # Append lab activities after the main text
  include_questions: true     # Append question banks after the main text
  include_reference: true     # Append reference appendices (math, units, periodic, index)

