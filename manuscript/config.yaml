# ---------------------------------------------------------------------------
# RENDERING OPTIONS
# ---------------------------------------------------------------------------
rendering:
  auto_number_chapters: true # Chapters numbered sequentially across units
  auto_number_figures: true # Figures numbered per-chapter (e.g., Fig 3.2)
  auto_number_equations: true # Equations numbered per-chapter (e.g., Eq 3.1)
  auto_number_tables: true # Tables numbered per-chapter
  figure_prefix: "Figure"
  equation_prefix: "Equation"
  table_prefix: "Table"
  # Pandoc/LaTeX output style; change to 'html' for web output
  output_format: "pdf"
  # Pandoc template (relative to manuscript/); leave blank for default
  pandoc_template: ""
  # Extra raw LaTeX header commands (inserted into preamble)
  latex_extra_header: ""

# ---------------------------------------------------------------------------
# LLM REVIEW (optional; requires Ollama)
# ---------------------------------------------------------------------------
llm:
  reviews:
    enabled: false
    types:
      - executive_summary
  translations:
    enabled: false
    languages:
      - zh

# ---------------------------------------------------------------------------
# ACCESSIBILITY
# See docs/accessibility.md: which keys are advisory vs test/code enforced.
# ---------------------------------------------------------------------------
accessibility:
  # Policy: alt text is ENFORCED by tests/test_accessibility.py, not by the PDF engine.
  alt_text_required: true
  # Matplotlib CVD-friendly palette: src/visualization/cvd.py; mermaid theming is documented separately.
  color_blindness_safe: true
  # If true: also set typography.body_font and preamble.md font commands (manual dual edit).
  dyslexia_friendly_font: false

# ---------------------------------------------------------------------------
# CONTENT NOTES (advisory — editorial scope; not read by build scripts)
# ---------------------------------------------------------------------------
content_notes:
  clinical_content: true
  animal_experiments: true
  quantitative_depth: "full" # "full" | "conceptual" | "advanced"

# ---------------------------------------------------------------------------
# CHAPTER METADATA (badges come from src/biology/chapter_metadata.py; flags are advisory)
# ---------------------------------------------------------------------------
chapter_metadata:
  show_difficulty: true
  show_prerequisites: true

# ---------------------------------------------------------------------------
# EXPORT OPTIONS (instructor/solutions toggles; not wired in project-local analysis scripts)
# ---------------------------------------------------------------------------
export:
  include_solutions: false
  include_worked_problems: true
  watermark_instructor: true
