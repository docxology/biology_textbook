# Orphan figure insertions: pair each ``src/visualization/`` generator output
# (PNG stem) with the chapter file that should reference it. The YAML loader at
# ``src/biology/pipeline/orphan_figures.py`` validates each row and the script
# ``scripts/insert_orphan_figures.py`` is a thin CLI orchestrator. Each row:
#
#   png:     figure file stem (also generator name)
#   target:  chapter path relative to ``manuscript/``
#   anchor:  literal substring marking the insertion point
#   caption: figure caption text
#   label:   crossref label, e.g. ``fig:unit_V_punnett_square``
#   alt:     accessibility alt text
insertions:
  - png: punnett_AaxAa
    target: unit_V/mendelian_principles.md
    anchor: Punnett Square
    caption: >-
      Punnett square for a monohybrid cross Aa × Aa. Each cell shows the zygote
      genotype; the 3:1 phenotype ratio follows directly from the 1:2:1 genotype
      ratio.
    label: fig:unit_V_punnett_square
    alt: >-
      Two-by-two Punnett square labeled with Aa times Aa showing four offspring:
      one AA homozygous dominant, two Aa heterozygous, one aa homozygous recessive.
  - png: light_response_curves
    target: unit_III/photosynthesis.md
    anchor: saturating light response
    caption: >-
      Light-response curves for C3 and C4 plants. Net CO2 assimilation versus
      photosynthetic photon flux density, showing light compensation point,
      light saturation, and maximum assimilation rate.
    label: fig:unit_III_light_response
    alt: >-
      Hyperbolic curves relating net photosynthesis to light intensity for C3
      and C4 plants, with the C4 curve saturating at higher irradiance.
  - png: methylation_heatmap
    target: unit_IV/chromatin_and_epigenetic_mechanisms.md
    anchor: methylation
    caption: >-
      DNA methylation heatmap across a panel of promoters and enhancers (rows)
      and cell lines (columns). Darker cells denote higher CpG methylation;
      cell-type-specific hypermethylation corresponds to silenced loci.
    label: fig:unit_IV_methylation_heatmap
    alt: >-
      Heatmap with regulatory elements on rows and cell types on columns;
      methylation level color-coded from low (yellow) to high (red).
  - png: logistic_growth
    target: unit_X/population_ecology.md
    anchor: logistic
    caption: >-
      Logistic growth toward carrying capacity K. Population size follows dN/dt
      equals rN times one minus N over K; the S-shaped curve inflects near N equals
      K over two and asymptotes at K.
    label: fig:unit_X_logistic_growth
    alt: >-
      Sigmoid population-size curve rising from a low initial abundance, inflecting
      near half the carrying capacity K, then leveling at K on the horizontal axis.
  - png: species_area_relationship
    target: unit_X/biomes_and_conservation.md
    anchor: species-area
    caption: >-
      Species–area relationship on log–log axes. The slope z of the linear fit
      (S = cA^z) ranges from ~0.15 for contiguous continental biomes to ~0.35
      for isolated oceanic islands, implying doubled habitat area roughly adds
      10 percent species (mainland) or 25 percent (islands).
    label: fig:unit_X_species_area
    alt: >-
      Log-log plot of species richness against area, with two distinct slopes
      for islands versus mainlands.
  - png: biome_distribution
    target: unit_X/biomes_and_conservation.md
    anchor: terrestrial biome
    caption: >-
      Terrestrial biomes in mean annual temperature-precipitation space
      (Whittaker-style classification). Point area reflects net primary
      productivity so tropical rainforest, temperate forest, savanna, desert,
      tundra, and marine reference sites are visually comparable.
    label: fig:unit_X_biome_distribution
    alt: >-
      Scatter plot with mean annual precipitation on the horizontal axis and mean
      annual temperature on the vertical axis; six labeled biome points differ in
      size by net primary productivity.
  - png: hardy_weinberg
    target: unit_V/population_genetics.md
    anchor: Hardy-Weinberg equilibrium
    caption: >-
      Hardy-Weinberg genotype-frequency curves. As allele frequency $p$ varies,
      $p^2$, $2pq$, and $q^2$ trace the expected AA, Aa, and aa proportions
      under random mating.
    label: fig:unit_V_hardy_weinberg
    alt: >-
      Three curves showing genotype frequencies versus allele frequency p for
      AA, Aa, and aa under Hardy-Weinberg equilibrium.
  - png: hill_equation
    target: unit_II/cell_signaling.md
    anchor: Hill coefficient
    caption: >-
      Hill-equation receptor occupancy for cooperative binding. Higher Hill
      coefficients steepen the sigmoid dose-response curve around the dissociation
      constant Kd, so a small ligand increase can switch occupancy from low to high
      when cooperativity is strong.
    label: fig:unit_II_hill_equation
    alt: >-
      Three sigmoid occupancy curves versus ligand concentration on a logarithmic
      horizontal axis; Hill coefficient one rises gradually, while coefficients two
      and four steepen the transition near the dissociation constant.
  - png: sir_model
    target: unit_VII/host_immunity_and_vaccines.md
    anchor: SIR trajectory
    caption: >-
      SIR epidemic model in a closed population. Susceptible individuals fall as
      infections rise and peak; recovered individuals accumulate after the infected
      compartment declines—peak height and timing depend on the basic reproduction
      number R zero.
    label: fig:unit_VII_sir_model
    alt: >-
      Three time-series curves labeled susceptible, infected, and recovered;
      infected rises to a peak while susceptible declines, then recovered increases
      as infected falls.
  - png: glycolysis_summary
    target: unit_III/bioenergetics_and_respiration.md
    anchor: glycolysis
    caption: >-
      Net ATP and NADH balance across the ten glycolysis steps. Bars distinguish
      the two ATP-investment steps, the four ATP-yielding payoff steps, and NADH
      formation at steps 6 and 9; the pathway sums to net 2 ATP and 2 NADH per
      glucose.
    label: fig:unit_III_glycolysis_summary
    alt: >-
      Grouped vertical bars for each glycolysis step showing ATP investment as
      negative bars in the first half, ATP production and NADH gains in the payoff
      half, totaling net two ATP and two NADH per glucose.
  - png: poiseuille_flow
    target: unit_IX/circulation_respiration_homeostasis.md
    anchor: Poiseuille
    caption: >-
      Hagen-Poiseuille law: volumetric blood flow versus vessel radius at fixed
      pressure gradient. Because flow scales with radius to the fourth power,
      halving radius reduces flow sixteenfold—a key reason arteriolar constriction
      controls tissue perfusion.
    label: fig:unit_IX_poiseuille_flow
    alt: >-
      Curve rising steeply with vessel radius on the horizontal axis and volumetric
      flow on the vertical axis; halving radius cuts flow by a factor of sixteen at
      fixed pressure gradient.
  - png: fitness_landscape
    target: unit_VI/genetic_drift_and_speciation.md
    anchor: Genetic drift
    caption: >-
      Mean population fitness as a function of allele frequency p under three
      selection regimes: directional selection (fitness rises toward one allele),
      heterozygote advantage (interior peak at intermediate p), and underdominance
      (fitness trough that can split the population).
    label: fig:unit_VI_fitness_landscape
    alt: >-
      Three curves of mean fitness versus allele frequency p: one rising to
      fixation, one with a central peak at intermediate p, and one with a valley
      that drops at both extremes.
  - png: molecular_clock
    target: unit_VI/phylogenetics.md
    anchor: molecular clock
    caption: >-
      Molecular-clock divergence times from t equals d divided by two mu. Larger
      sequence divergence or slower substitution rates lengthen the inferred branch;
      faster-evolving genes or smaller divergences yield shorter estimates when the
      rate mu is held constant.
    label: fig:unit_VI_molecular_clock
    alt: >-
      Horizontal bars comparing estimated divergence times in millions of years for
      four taxon pairs; longer bars correspond to larger divergence or slower
      evolutionary rates.
  - png: biodiversity_indices
    target: unit_X/community_interactions.md
    anchor: Shannon
    caption: >-
      Shannon H prime and Simpson one minus D for two communities with the same
      species richness but different evenness. Higher evenness raises both indices
      relative to a skewed dominance distribution dominated by one grassland species.
    label: fig:unit_X_biodiversity_indices
    alt: >-
      Side-by-side bars for Shannon and Simpson indices in an even meadow versus a
      grassland dominated by one species; the even community shows higher bars for
      both metrics.
  - png: photosynthesis_rate
    target: unit_VIII/plant_responses.md
    anchor: photosynthesis
    caption: >-
      Net photosynthesis light-response curves for C3-like and C4-like
      parameter sets. Higher light-saturation points and lower dark respiration
      shift the compensation and saturation regions.
    label: fig:unit_VIII_photosynthesis_rate
    alt: Two hyperbolic net-photosynthesis curves versus photosynthetically active radiation.
  - png: osmotic_pressure
    target: unit_I/water_and_life.md
    anchor: osmotic
    caption: >-
      van 't Hoff osmotic pressure versus solute concentration at 37 degrees Celsius.
      A non-electrolyte (i equals 1) and a fully dissociating electrolyte (i equals 2)
      produce linear rises with concentration; doubling i doubles osmotic pressure at
      equal molarity.
    label: fig:unit_I_osmotic_pressure
    alt: >-
      Two straight lines of osmotic pressure increasing with solute concentration on
      the horizontal axis; the steeper line marks an electrolyte with van t Hoff
      factor two at body temperature, doubling the pressure of a non-electrolyte at
      equal molarity.
  - png: translation_codons
    target: unit_IV/gene_expression.md
    anchor: translation
    caption: >-
      Amino-acid composition after in silico translation of a sample mRNA. Bar
      height counts each residue type in the reading frame, showing how codon
      usage and sequence length shape peptide composition under the standard
      genetic code.
    label: fig:unit_IV_translation_codons
    alt: >-
      Vertical bars ranking the twenty amino acids by count after translating a
      sample messenger RNA sequence in the standard reading frame; the tallest
      bars mark the most frequent residues in the encoded peptide.
  - png: mic_dilution_series
    target: unit_VII/microbial_ecology.md
    anchor: MIC
    caption: >-
      Two-fold serial broth dilution for minimum inhibitory concentration (MIC)
      testing. Antibiotic concentration halves in each successive tube; the first
      tube with no visible growth marks the MIC used to compare susceptibility.
    label: fig:unit_VII_mic_dilution_series
    alt: >-
      Eight ordered tubes or bars with antibiotic concentration dropping by half
      each step on a logarithmic scale; the last tube showing visible growth
      marks the MIC boundary.
  - png: homeostasis_feedback
    target: unit_IX/endocrine_signaling.md
    anchor: homeostasis
    caption: >-
      Generic proportional negative feedback toward a set point (temperature shown
      as an example). Each correction is proportional to the measured error, so
      large deviations trigger stronger responses and the system converges without
      indefinite overshoot—the same logic applies to hormone axes such as the
      thyroid loop below.
    label: fig:unit_IX_homeostasis_feedback
    alt: >-
      Line plot of measured value approaching a horizontal set-point line across
      iterations; corrective responses shrink as the error decreases, illustrating
      proportional negative feedback.
  - png: food_web_trophic_levels
    target: unit_X/ecosystem_ecology.md
    anchor: trophic
    caption: >-
      Trophic levels assigned from phytoplankton producers upward in a simplified
      aquatic food web. Each consumer sits one level above its prey; apex predators
      occupy the highest bar in this linear chain.
    label: fig:unit_X_food_web_trophic_levels
    alt: >-
      Horizontal bars ordered from producer at level one through herbivore,
      secondary consumer, and apex predator at level four in a linear aquatic food
      chain.
